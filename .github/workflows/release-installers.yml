name: Release Installers

# Pushing a tag like v0.2.2 builds native installers (macOS .pkg, Debian .deb, Windows .exe),
# smoke-tests each one by installing it on a clean runner, and attaches them to a GitHub Release.
#
# Running it by hand from the Actions tab ("Run workflow") does everything except the release:
# the installers are uploaded as workflow artifacts so a build can be checked before tagging.
# See docs/installers.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Check the tag matches package.json and is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version (npm version) before tagging."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main. Releases must be cut from main."
            exit 1
          fi

  installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"

      - run: npm ci

      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installers
        run: npm run installers -- --platform ${{ matrix.platform }} --arch all

      # Integration test: install the real artifact the way a user would, on a runner that has
      # never seen this app, then run the installed binary. This is what proves the bundled Node
      # runtime, the launcher, and node:sqlite work outside the build tree.
      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "unexpected arch $(uname -m)"; exit 1 ;;
          esac
          sudo installer -pkg release/taskfile-*-macos-"$arch".pkg -target /
          export HOME="$(mktemp -d)"
          test "$(taskfile --version)" = "$(node -p "require('./package.json').version")"
          taskfile add "smoke test"
          taskfile list | grep "smoke test"

      - name: Smoke test (Debian)
        if: matrix.platform == 'linux'
        run: |
          sudo dpkg -i release/taskfile_*_amd64.deb
          export HOME="$(mktemp -d)"
          test "$(taskfile --version)" = "$(node -p "require('./package.json').version")"
          taskfile add "smoke test"
          taskfile list | grep "smoke test"
          sudo apt-get remove -y taskfile
          test ! -e /usr/bin/taskfile
          test ! -e /usr/lib/taskfile

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          function Invoke-Checked {
            param([string]$Exe, [string[]]$Arguments)
            $output = & $Exe @Arguments
            if ($LASTEXITCODE -ne 0) { throw "$Exe $Arguments exited with $LASTEXITCODE" }
            return $output
          }

          $expected = node -p "require('./package.json').version"
          $installer = Get-ChildItem release\taskfile-*-windows-x64-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\taskfile'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'smoke-home'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null

          $version = Invoke-Checked "$dir\taskfile.cmd" @('--version')
          if ($version -ne $expected) { throw "Expected version $expected, got $version" }
          Invoke-Checked "$dir\taskfile.cmd" @('add', 'smoke test') | Out-Null
          $listing = Invoke-Checked "$dir\taskfile.cmd" @('list')
          if (-not ($listing -match 'smoke test')) { throw "Task missing from list output: $listing" }

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { throw "$dir was not added to the user PATH" }

          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $dir) { throw "$dir was left on the user PATH after uninstall" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.pkg
            release/*.deb
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    # Only tagged runs publish; manual runs stop after uploading artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

          # docs/deploy.md has people create the release by hand; if it already exists, add to it.
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" * --clobber --repo "$REPO"
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" * --repo "$REPO" --title "$TAG" --generate-notes $prerelease
          fi
