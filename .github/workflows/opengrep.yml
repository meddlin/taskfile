name: Opengrep

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  OPENGREP_VERSION: v1.32.0
  # sha256 of opengrep_manylinux_x86 for the version above (GitHub release asset digest)
  OPENGREP_SHA256: 7360d60174880bd9214f2dfbe439b7bce82b7a3d44cfe945ba833c85cc8bda75

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Opengrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep-rules
          persist-credentials: false

      - name: Install Opengrep
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $RUNNER_TEMP/opengrep" | sha256sum --check
          chmod +x "$RUNNER_TEMP/opengrep"

      # Skipped on purpose: tests are not shipped, and the i18next rule is a portability nudge that flags
      # every user-facing string in the English-only apps (24 findings across the web app and the TUI).
      - name: Scan
        run: |
          "$RUNNER_TEMP/opengrep" scan \
            --config .opengrep-rules/typescript \
            --config .opengrep-rules/javascript \
            --exclude .opengrep-rules \
            --exclude node_modules \
            --exclude dist \
            --exclude '*.test.ts' \
            --exclude '*.test.tsx' \
            --exclude-rule opengrep-rules.typescript.react.portability.i18next.jsx-not-internationalized \
            --sarif-output=opengrep.sarif \
            .

      # Opengrep still lists findings silenced with an in-source `nosemgrep` comment (marked as
      # suppressed in the SARIF) and `--error` would fail on them, so gate on unsuppressed results only.
      - name: Fail on unsuppressed findings
        run: |
          jq -r '.runs[] | (.results // [])[] | select((.suppressions // []) | length == 0)
            | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
            opengrep.sarif | tee findings.txt
          test ! -s findings.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: opengrep-sarif
          path: opengrep.sarif
          if-no-files-found: ignore
