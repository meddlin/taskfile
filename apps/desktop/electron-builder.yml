# Packaging for the Taskfile desktop app (macOS only for now).
#
#   npm run package -w @taskfile/desktop   unpacked .app in release/, unsigned (for checking a build)
#   npm run dist -w @taskfile/desktop      signed + notarized DMG/ZIP (needs the credentials below)
#
# Signing and notarization read their credentials from the environment, never from this file:
# CSC_LINK / CSC_KEY_PASSWORD (Developer ID Application certificate; a local build uses the
# identity in your login keychain instead) and APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER.
# Notarization turns itself on when those three are set.

# Reverse-DNS of rushinglabs.com. It is part of the code signature and of where macOS stores app
# preferences, so don't change it after the first public release: that orphans existing installs.
appId: com.rushinglabs.taskfile
productName: Taskfile
copyright: Copyright © Rushing Labs

directories:
  output: release

# Everything the app runs is in dist/main.mjs: scripts/build.mjs bundles the web app's server and
# its dependencies into it, so no node_modules ships.
files:
  - dist/**
  - package.json
  - "!dist/client/**"
  - "!dist/**/*.map"

asar: true
npmRebuild: false

# The web app's static assets are read from disk by the in-process server, so they sit outside the
# ASAR (src/main/index.ts reads them from Resources/client).
extraResources:
  - from: dist/client
    to: client

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Name the DMG and ZIP after their architecture; without this the Intel build has no suffix.
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
    - target: zip

dmg:
  title: ${productName} ${version}
